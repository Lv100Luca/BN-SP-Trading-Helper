# Builds the single-file executable on Windows, macOS and Linux and attaches the zips to a
# GitHub Release whenever a tag like v0.1.0 is pushed:
#     git tag v0.1.0 && git push --tags
# (Bump app/__init__.py __version__ first so the file names match.)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build and package
        run: python build.py --release
      - name: Smoke-test the executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ./dist/TradeCheck.exe --selftest selftest.txt; else ./dist/TradeCheck --selftest selftest.txt; fi
          cat selftest.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: release/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
